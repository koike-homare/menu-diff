<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>メニュー差分チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 校正紙 — 左右に「変更前」「変更後」を並べ、その下に変更商品一覧を置く作業台 */
:root{
  --paper:#F3F5F2; --surface:#FFFFFF; --ink:#1D2227; --muted:#5B636B; --line:#D9DDD8; --line-strong:#B9BFBA;
  --shu:#C23E28; --shu-soft:#F8E4DF;
  --add:#2C7A4C; --add-soft:#E1F1E7;
  --del:#6A7178; --del-soft:#ECEEEC;
  --name:#2B57A3; --name-soft:#E2EAF7;
  --cat:#7748A0; --cat-soft:#EFE6F6;
  --desc:#946410; --desc-soft:#F6EDD9;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14171A; --surface:#1C2024; --ink:#E7EAE6; --muted:#9AA2A9; --line:#2F353A; --line-strong:#444C52;
  --shu:#F06C52; --shu-soft:#3B221D;
  --add:#62C48E; --add-soft:#1B3125;
  --del:#A3AAB0; --del-soft:#272C30;
  --name:#86AAEC; --name-soft:#1E2A40;
  --cat:#BC9BDD; --cat-soft:#2C2238;
  --desc:#DDAE4E; --desc-soft:#33291A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171A; --surface:#1C2024; --ink:#E7EAE6; --muted:#9AA2A9; --line:#2F353A; --line-strong:#444C52;
  --shu:#F06C52; --shu-soft:#3B221D;
  --add:#62C48E; --add-soft:#1B3125;
  --del:#A3AAB0; --del-soft:#272C30;
  --name:#86AAEC; --name-soft:#1E2A40;
  --cat:#BC9BDD; --cat-soft:#2C2238;
  --desc:#DDAE4E; --desc-soft:#33291A;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.login-card .sb-brand{color:var(--muted)}
.login-card .sb-brand b{color:var(--ink);font-size:1.3rem}
.login-card p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.7}
.login-card form{display:flex;flex-direction:column;gap:10px}
.login-msg{color:var(--shu);font-size:.84rem;min-height:1.2em}
.sb-foot{margin-top:auto;border-top:1px solid var(--nav-line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;font-size:.76rem;color:var(--nav-muted);word-break:break-all}
.sb-foot button{align-self:flex-start;background:none;border:1px solid var(--nav-line);color:var(--nav-fg);border-radius:5px;padding:3px 10px;cursor:pointer;font-size:.76rem}
@media (max-width:900px){.sb-foot{margin:0 0 0 auto;border:0;flex-direction:row;align-items:center;padding:6px 16px}.sb-foot #me-email{display:none}}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.65;padding-block:0}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);align-items:start;min-height:100%}
.wrap{min-width:0;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* sidebar: app navigation (always dark, matching the 社内システム nav) */
:root{--nav-bg:#121726;--nav-fg:#C8CDDA;--nav-strong:#EEF0F6;--nav-muted:#7D8599;--nav-line:#232A3E;--nav-hover:#1A2034;--nav-active-bg:#25274B;--nav-active-fg:#9095F7;--nav-input:#1A1F31;--nav-red:#F28A74;--nav-red-bg:#3A2226;--nav-green:#6FCB98;--nav-green-bg:#1D3227}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--nav-bg);color:var(--nav-fg);min-width:0;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
.sb-head{padding:18px 18px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px solid var(--nav-line)}
.sb-brand{font-size:.72rem;letter-spacing:.14em;color:var(--nav-muted)}
.sb-brand b{display:block;font-family:var(--font-display);font-size:1rem;letter-spacing:.04em;color:var(--nav-strong);font-weight:800}
#sb-toggle{background:var(--nav-input);color:var(--nav-fg);border-color:var(--nav-line)}
.sb-body{display:flex;flex-direction:column;min-height:0;flex:1;overflow-y:auto;padding:10px 0 20px}
.nav-item{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:0 8px;padding:10px 12px;border-radius:6px;background:none;border:1px solid transparent;color:var(--nav-fg);font-weight:700;font-size:.92rem;text-align:left;cursor:pointer}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--nav-hover)}
.nav-item[aria-current="page"]{background:var(--nav-active-bg);color:var(--nav-active-fg);border-color:rgba(238,240,246,.55)}
.nav-sub{margin:6px 8px 0 20px;padding-left:12px;border-left:1px solid var(--nav-line);display:flex;flex-direction:column;gap:8px}
.nav-new{display:flex;align-items:center;gap:8px;background:none;border:1px dashed var(--nav-line);color:var(--nav-fg);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:.84rem;font-weight:500}
.nav-new:hover{border-color:var(--nav-muted);color:var(--nav-strong)}
.nav-new[aria-current="true"]{border-style:solid;border-color:var(--nav-active-fg);color:var(--nav-active-fg)}
.sb-label{font-size:.68rem;letter-spacing:.14em;color:var(--nav-muted);margin-top:6px}
.sb-add{display:flex;gap:6px}
.sb-input{width:100%;min-width:0;border:1px solid var(--nav-line);border-radius:5px;background:var(--nav-input);color:var(--nav-strong);padding:6px 9px;font-size:.82rem}
.sb-input::placeholder{color:var(--nav-muted)}
.sb-add .btn{background:var(--nav-input);color:var(--nav-fg);border-color:var(--nav-line)}
.sb-list{padding:0;list-style:none;margin:0;display:flex;flex-direction:column;gap:2px}
.store-btn{width:100%;text-align:left;background:none;border:0;padding:7px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--nav-fg);border-radius:5px}
.store-btn:hover{background:var(--nav-hover)}
.store.open>.store-btn{color:var(--nav-strong)}
.store-name{font-weight:700;font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.store-meta{font-size:.7rem;color:var(--nav-muted);white-space:nowrap}
.store-btn .caret{color:var(--nav-muted);font-size:.6rem;display:inline-block;transition:transform .15s}
.store.open .caret{transform:rotate(90deg)}
.recs{list-style:none;padding:2px 0 6px 8px;margin:0 0 0 12px;border-left:1px solid var(--nav-line)}
.rec{width:100%;text-align:left;background:none;border:1px solid transparent;padding:6px 8px;cursor:pointer;border-radius:5px;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--nav-fg)}
.rec:hover{background:var(--nav-hover)}
.rec[aria-current="true"]{background:var(--nav-active-bg);border-color:rgba(238,240,246,.4);color:var(--nav-strong)}
.rec-date{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:.76rem}
.rec-memo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--nav-muted);font-size:.7rem}
.badge{font-size:.66rem;font-weight:700;padding:0 6px;border-radius:3px;white-space:nowrap}
.badge.open{background:var(--nav-red-bg);color:var(--nav-red)}
.badge.ok{background:var(--nav-green-bg);color:var(--nav-green)}
.sb-empty{padding:6px 8px;color:var(--nav-muted);font-size:.78rem;line-height:1.55}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;height:auto;z-index:5;flex-direction:row;align-items:center;flex-wrap:wrap;padding-right:env(safe-area-inset-right,0px)}
  .sb-head{border-bottom:0;padding:10px 16px}
  .sb-brand{font-size:.62rem}.sb-brand b{font-size:.88rem}
  .sb-body{flex-direction:row;padding:6px 8px;overflow:visible}
  .nav-item{width:auto;margin:0;padding:8px 12px;font-size:.86rem}
}

/* page head */
.page-head{align-items:flex-end}
.ph-text{min-width:0;flex:1 1 420px}
.ph-text p{margin:6px 0 0;color:var(--muted);max-width:62ch;font-size:.88rem}
.ph-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.crumb-link{background:none;border:0;padding:0;font:inherit;color:var(--name);cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.crumb-link:hover{text-decoration-color:currentColor}
.renameform{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.renameform .in{font-family:var(--font-display);font-size:1.3rem;font-weight:800;flex:1 1 260px;width:auto}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;color:var(--shu)}
.donetoggle{display:flex;align-items:center;gap:6px;font-size:.86rem;cursor:pointer;border:1px solid var(--line-strong);border-radius:5px;padding:4px 10px;background:var(--surface)}
.srcnames{display:block;width:100%;font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}

/* list views: 店舗一覧 / レコード一覧 */
.view{display:flex;flex-direction:column;gap:24px}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.list-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.in{border:1px solid var(--line-strong);border-radius:5px;background:var(--paper);padding:8px 10px;font-size:.88rem;width:100%;min-width:0}
.in.search{flex:1 1 220px;width:auto}
.addform{display:flex;gap:8px;flex:1 1 320px;min-width:0}
.addform.wide{flex-basis:100%}
.addform .btn{white-space:nowrap}
.rowlist{list-style:none;margin:0;padding:0}
.listhead,.rowlink{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.4fr) 9.5em 1em;gap:6px 18px;align-items:center;padding-inline:18px}
.listhead{font-size:.72rem;letter-spacing:.1em;color:var(--muted);padding-block:8px;border-bottom:1px solid var(--line)}
.rowlink{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding-block:14px;cursor:pointer;color:var(--ink)}
.rowlist li:last-child .rowlink{border-bottom:0}
.rowlink:hover{background:var(--paper)}
.rowlink:hover .rl-go{color:var(--ink);transform:translateX(2px)}
.rl-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.rl-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}
.rl-rec{font-weight:500;overflow-wrap:anywhere}
.rl-sub{color:var(--muted);font-size:.78rem}
.rl-status{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rl-date{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;white-space:nowrap}
.rl-go{color:var(--muted);font-size:1.2rem;transition:transform .15s}
.st{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:3px;white-space:nowrap}
.st-todo{background:var(--del-soft);color:var(--del)}
.st-open{background:var(--shu-soft);color:var(--shu)}
.st-ok{background:var(--add-soft);color:var(--add)}
.rowlist .empty{padding:32px 18px;line-height:1.9}
.rowlist .empty .btn{margin-top:10px}
@media (max-width:640px){
  .listhead{display:none}
  .rowlink{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .rl-col2{grid-column:1;order:3}
  .rl-date{grid-column:1;order:4}
  .rl-go{grid-row:1;grid-column:2}
  .addform{flex-wrap:wrap}.addform .btn{flex:1 1 auto}
}

/* main column + breadcrumb */
.main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
@media (max-width:900px){.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}}
.crumb{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--muted);margin:0 0 6px;padding:0;list-style:none}
.crumb li+li::before{content:"›";margin-right:8px;color:var(--line-strong)}
.crumb li:last-child{color:var(--ink);font-weight:500}

/* record bar + save form in results */
.recbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 20px;background:var(--name-soft);font-size:.86rem;border-bottom:1px solid var(--line)}
.recbar b{font-family:var(--font-display);font-size:1rem}
.recbar .spacer{flex:1}
.recbar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.savestate{color:var(--muted);font-size:.78rem}
.saveform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper);font-size:.86rem}
.saveform b{margin-right:4px}
.saveform select,.saveform input{border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);padding:6px 9px;font-size:.85rem;min-width:0}
.saveform #sv-memo{flex:1 1 200px}
.btn.danger{border-color:var(--shu);color:var(--shu)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.3}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header h1{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800;letter-spacing:.02em}
header h1 .stamp{display:inline-block;font-size:.5em;vertical-align:.35em;margin-left:.5em;padding:.05em .45em;border:2px solid var(--shu);color:var(--shu);border-radius:4px;letter-spacing:.1em;transform:rotate(-4deg)}
header p{margin:0;color:var(--muted);max-width:52ch}

/* inputs */
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.side-head{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0}
.side-head .tag{font-size:.72rem;letter-spacing:.12em;font-weight:700;padding:2px 8px;border-radius:3px}
.side[data-side="cur"] .tag{background:var(--del-soft);color:var(--del)}
.side[data-side="new"] .tag{background:var(--shu-soft);color:var(--shu)}
.side-head h2{font-size:1.15rem}
.side-head .sub{color:var(--muted);font-size:.82rem;margin-left:auto}
.tabs{display:flex;gap:2px;padding:12px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pane{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.drop{border:1.5px dashed var(--line-strong);border-radius:6px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--muted);transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--paper);border-color:var(--ink);color:var(--ink)}
.drop strong{display:block;color:var(--ink);font-weight:700;margin-bottom:2px}
.drop small{font-size:.78rem}
.files{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:3px 4px 3px 9px;font-size:.82rem;max-width:100%}
.files li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.files li em{font-style:normal;color:var(--muted);font-size:.72rem}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 6px;font-size:1rem;line-height:1}
.x:hover{color:var(--shu)}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:5px;background:var(--paper);padding:10px;line-height:1.55;font-size:.88rem}
input[type=url]{width:100%;border:1px solid var(--line);border-radius:5px;background:var(--paper);padding:8px 10px}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.steps{margin:0;padding-left:1.3em;font-size:.84rem;color:var(--muted)}
.steps li{margin:2px 0}
.linkout{font-size:.84rem;color:var(--name)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.side-foot b{color:var(--ink)}
.side-foot button{margin-left:auto}

/* run bar */
.runbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;padding:11px 26px;font-size:1rem}
.btn.small{padding:4px 10px;font-size:.8rem}
.progress{flex:1 1 280px;min-width:0;font-size:.88rem;color:var(--muted)}
.progress .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.progress .bar i{display:block;height:100%;width:30%;background:var(--shu);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.progress .bar i{animation:none;width:100%;opacity:.5}}
.err{color:var(--shu)}

/* results */
.results{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.res-head{padding:18px 20px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;border-bottom:1px solid var(--line)}
.res-head h2{font-size:1.4rem}
.res-head h2 small{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:10px}
.res-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sample-note{margin:0;padding:8px 20px;background:var(--desc-soft);color:var(--desc);font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px 14px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-bottom:1px solid var(--line)}
.ov{display:flex;flex-direction:column;gap:2px;padding:12px 20px;border-right:1px solid var(--line)}
.ov:last-child{border-right:0}
.ov-l{font-size:.74rem;color:var(--muted);letter-spacing:.06em}
.ov b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:500;line-height:1.2}
.ov small{font-size:.74rem;color:var(--muted)}
.ov.hl b{color:var(--shu)}
.ov.warn b{color:var(--shu)}
.ov.ok b{color:var(--add)}
.chips-label{padding:12px 20px 0;font-size:.74rem;letter-spacing:.06em;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:.86rem}

/* ---------- state ---------- */

const hist={stores:[],loaded:false,ready:false,error:false,storeId:null,records:[],recLoaded:false,unsubRecs:null,q:"",renaming:false,confirmDel:false};

/* sample data (例) so the first view shows what the tool does */
const SAMPLE={
  cur:[

  ],
  new:[
    {category:"前菜",name:"自家製ポテトサラダ",price:480,description:""},
    {category:"前菜",name:"枝豆",price:400,description:""},

    {category:"揚げ物",name:"フライドポテト",price:450,description:""},

};

/* ---------- backend (Supabase) ---------- */
const CFG=window.APP_CONFIG;
const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
let sample=null, limits={images:{maxCount:4}}, db=null, me={email:""}, canWrite=true;
const downloads={ async save({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data]);
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); return {status:"saved"};
}};
const companyOk=email=>String(email||"").toLowerCase().endsWith("@"+CFG.emailDomain.toLowerCase());

/* login */
function showLogin(msg){

  $("#login-msg").textContent=msg||""; $("#login-pw").value=""; setTimeout(()=>$("#login-pw").focus(),0);

$("#login-form").onsubmit=async e=>{
  e.preventDefault();

  const {error}=await sb.auth.signInWithPassword({email:CFG.sharedEmail,password:pw});
  btn.disabled=false;
  if(error){
    $("#login-msg").textContent=/invalid/i.test(error.message)?"パスワードが違います。":/rate|too many|seconds/i.test(error.message)?"何度も失敗したため、しばらくログインできません。数分待ってからお試しください。":"ログインできませんでした。通信状態を確認してもう一度お試しください。";
    $("#login-pw").select(); return;
  }
  $("#login-msg").textContent="";
};

sb.auth.onAuthStateChange((_ev,session)=>{ setTimeout(()=>onSession(session),0); });
sb.auth.getSession().then(({data})=>onSession(data.session));

/* reading through the server function (Claude API) */
async function callExtract(payload,signal){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw {code:"session_expired",message:"ログインの有効期限が切れました。もう一度ログインしてください。"};
  let res;
  try{
    res=await fetch(`${CFG.supabaseUrl}/functions/v1/extract-menu`,{method:"POST",signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":CFG.supabaseKey},
      body:JSON.stringify(payload)});
  }catch(e){ if(signal&&signal.aborted) throw {code:"cancelled"}; throw {code:"network",message:"サーバーに接続できませんでした。通信状態を確認してください。"}; }
  const out=await res.json().catch(()=>null);
  if(!res.ok) throw {code:(out&&out.code)||"upstream_error",message:(out&&out.message)||"読み取りに失敗しました。もう一度お試しください。"};
  return out;
}
async function toImagePayload(blob){
  // 長辺1600pxのJPEGに縮小して送る（通信量と読み取り時間を抑える）
  const bmp=await createImageBitmap(blob);
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",0.85);
  return {media_type:"image/jpeg",data:url.slice(url.indexOf(",")+1)};
}

/* ---------- stores → records ---------- */
const fmtDate=t=>{ if(!t) return ""; const d=new Date(t),p=x=>String(x).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const plain=items=>items.map(x=>({category:x.category||"",name:x.name||"",price:x.price??null,description:x.description||""}));

const leftCount=()=>state.diff?state.diff.rows.filter(r=>!state.done.has(r.id)).length:0;
const summaryOf=()=>({diffCount:state.diff?state.diff.rows.length:null,leftCount:state.diff?leftCount():null,sameCount:state.diff?state.diff.same.length:null});
const storeById=id=>hist.stores.find(s=>s.id===id);
const dbErr=e=>e&&/duplicate|unique/i.test(e.message||"")?"同じ名前がすでにあります。":e&&/foreign key|violates/i.test(e.message||"")?"レコードがある店舗は削除できません。":"保存できませんでした。通信状態を確認してもう一度お試しください。";
const who=email=>!email||email===CFG.sharedEmail?"":String(email).split("@")[0];
const ts=v=>v?Date.parse(v):null;

async function loadStores(){
  const {data,error}=await sb.from("stores").select("id,name,last_title,last_at,created_at").order("last_at",{ascending:false});

async function loadRecords(id){
  const {data,error}=await sb.from("records").select("id,title,status,diff_count,left_count,created_at,updated_at,created_by_email").eq("store_id",id).order("updated_at",{ascending:false});
  if(hist.storeId!==id) return;
  hist.records=error?[]:data.map(r=>({id:r.id,title:r.title,status:r.status,diffCount:r.diff_count,leftCount:r.left_count,createdAt:ts(r.created_at),updatedAt:ts(r.updated_at),by:r.created_by_email}));
  hist.recLoaded=true;
}

function renderView(){

  if(view==="stores"){ await loadStores(); if(state.view==="stores"){ renderStoreRows(); } }
  if(view==="store"){ await loadRecords(storeId); if(state.view==="store"){ renderRecordRows(); renderActions(); } }

/* autosave for the open record */
let pendSum={}, pendItems=false, saveTimer=null, saving=Promise.resolve(), saveText="";
const SUMCOL={diffCount:"diff_count",leftCount:"left_count",sameCount:"same_count",status:"status",sources:"sources"};
function scheduleSave(sum,items){
  if(!state.current||!db) return;
  Object.assign(pendSum,sum||{}); if(items) pendItems=true;
  setSaveText("保存待ち…"); clearTimeout(saveTimer); saveTimer=setTimeout(flushNow,700);
}
function flushNow(){
  clearTimeout(saveTimer); saveTimer=null;
  const c=state.current; if(!c||!db||(!pendItems&&!Object.keys(pendSum).length)) return;
  const now=new Date().toISOString();
  const row={updated_at:now}; Object.entries(pendSum).forEach(([k,v])=>{ if(SUMCOL[k]) row[SUMCOL[k]]=v; });
  const items=pendItems?{record_id:c.recId,cur_items:plain(itemsOf("cur")),new_items:plain(itemsOf("new")),done:[...state.done],updated_at:now}:null;
  pendSum={}; pendItems=false;
  saving=saving.then(async()=>{
    if(items){ const {error}=await sb.from("record_items").upsert(items,{onConflict:"record_id"}); if(error) throw error; }
    const {error}=await sb.from("records").update(row).eq("id",c.recId); if(error) throw error;
  }).then(()=>setSaveText("自動保存済み"),e=>setSaveText(dbErr(e)));
}

/* ---------- reading files ---------- */
function decodeText(buf){
  let t=new TextDecoder("utf-8").decode(buf);
  if((t.match(new RegExp(String.fromCharCode(0xFFFD),"g"))||[]).length>3){ try{ t=new TextDecoder("shift_jis").decode(buf); }catch(e){} }
  return t;
}
async function readSources(side,signal,onStep){
  const st=state[side]; const texts=[]; const images=[]; const notes=[];
  for(const f of st.files){
    if(signal.aborted) throw {code:"cancelled"};
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    onStep(`${f.name} を開いています`);
    try{
      if(["xlsx","xls","xlsm"].includes(ext)){
        if(!window.XLSX) throw new Error("Excel読み込み部品が読み込めませんでした");
        const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
        wb.SheetNames.forEach(n=>{ const csv=XLSX.utils.sheet_to_csv(wb.Sheets[n],{blankrows:false}); if(csv.trim()) texts.push({label:`${f.name} / シート「${n}」`,text:csv}); });
      }else if(["csv","tsv","txt"].includes(ext)){
        texts.push({label:f.name,text:decodeText(await f.arrayBuffer())});
      }else if(ext==="docx"){
        if(!window.mammoth) throw new Error("Word読み込み部品が読み込めませんでした");
        const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
        texts.push({label:f.name,text:r.value});
      }else if(ext==="pdf"){
        await readPdf(f,texts,images,onStep,signal);
      }else if(["jpg","jpeg","png","webp","gif"].includes(ext)){
        images.push({label:f.name,blob:f});
      }else if(ext==="doc"){
        notes.push(`${f.name}：古いWord形式（.doc）は読めません。.docx か PDF で保存し直してください。`);
      }else{
        notes.push(`${f.name}：この形式は読み込めません。`);
      }
    }catch(e){ if(e&&e.code==="cancelled") throw e; notes.push(`${f.name}：${e.message||"読み込みに失敗しました"}`); }
  }
  if(st.text.trim()) texts.push({label:"貼り付けテキスト",text:st.text});
  if((st.webText||"").trim()) texts.push({label:"グルメサイト"+(st.url?`（${st.url}）`:""),text:st.webText});
  return {texts,images,notes};
}
async function readPdf(f,texts,images,onStep,signal){
  const lib=window.pdfjsLib; if(!lib) throw new Error("PDF読み込み部品が読み込めませんでした");
  const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
  const pages=Math.min(doc.numPages,20);
  let buf="";
  for(let p=1;p<=pages;p++){
    if(signal.aborted) throw {code:"cancelled"};
    onStep(`${f.name}　${p}/${pages} ページ`);
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    const rows=[]; // group by baseline
    tc.items.forEach(it=>{ if(!it.str) return; const y=Math.round(it.transform[5]); let r=rows.find(r=>Math.abs(r.y-y)<=3); if(!r){r={y,parts:[]};rows.push(r);} r.parts.push({x:it.transform[4],s:it.str}); });
    rows.sort((a,b)=>b.y-a.y);
    const txt=rows.map(r=>r.parts.sort((a,b)=>a.x-b.x).map(x=>x.s).join(" ")).join("\n");
    if(txt.replace(/\s/g,"").length>=40){ buf+=`\n--- ${p}ページ ---\n`+txt; }
    else{
      const vp0=page.getViewport({scale:1}); const scale=Math.min(2.5,1800/Math.max(vp0.width,vp0.height));
      const vp=page.getViewport({scale}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
      images.push({label:`${f.name} ${p}ページ`,blob});
    }
  }
  if(buf.trim()) texts.push({label:f.name,text:buf});
}

/* ---------- Claude extraction ---------- */
const RULES=`あなたは飲食店のメニュー表を正確にデータ化する担当者です。資料から、お客様に提供される全メニュー品目を漏れなく抜き出してください。
ルール:
- 1品目につき1件。サイズ・量・人数で価格が違う場合は別の品目に分け、名前の末尾に（中）（大）（2人前）などを付ける
- price は税込価格を整数（円）で。税込と税抜が併記されていれば税込。記載がない・読めない場合は null
- price_text は資料の表記どおりの価格文字列
- category は資料上の見出し（例：前菜、揚げ物、ドリンク）。見出しがなければ ""
- description は品目に付いた説明文・内容量・注記（期間限定、数量限定、アレルギー表示など）。なければ ""
- 店名、住所、営業時間、サービス料の案内など、品目でないものは含めない
- 推測で補ったり言い換えたりしない。表記どおりに写す
- 資料が「変更依頼」の文面なら、記載された品目だけを抜き出す
返答はJSONのみ: {"items":[{"category":"前菜","name":"枝豆","price":380,"price_text":"380円","description":""}]}`;

function cleanItems(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(x=>x&&String(x.name||"").trim()).map(x=>({
    category:String(x.category||"").trim(), name:String(x.name).trim(),
    price: typeof x.price==="number"&&isFinite(x.price)?Math.round(x.price):parsePrice(x.price_text),
    description:String(x.description||"").trim()
  }));
}
function parsePrice(s){ if(s==null) return null; const m=String(s).normalize("NFKC").replace(/,/g,"").match(/\d+/); return m?parseInt(m[0],10):null; }

async function extractSide(side,signal,onStep){
  const {texts,images,notes}=await readSources(side,signal,onStep);
  if(!texts.length&&!images.length) throw {code:"no_source",message:`${SIDES[side].label}：読み取れる資料がありません。`+(notes.length?"\n"+notes.join("\n"):"")};
  let items=[];
  // text in chunks
  const joined=texts.map(t=>`### 資料：${t.label}\n${t.text}`).join("\n\n");
  const CH=60000;
  for(let i=0;i<joined.length;i+=CH){
    onStep(`${SIDES[side].label}の文字を商品ごとに分けています`+(joined.length>CH?`（${i/CH+1}/${Math.ceil(joined.length/CH)}）`:""));
    const r=await callExtract({text:joined.slice(i,i+CH)},signal);
    if(r&&r.truncated) notes.push("資料が長いため、読み取りが途中で切れた可能性があります。読み取り結果を確認してください。");
    items=items.concat(cleanItems(r&&r.items));
  }
  if(images.length){
    const max=limits.images.maxCount||5;
    for(let i=0;i<images.length;i+=max){
      const g=images.slice(i,i+max);
      onStep(`${SIDES[side].label}の画像を読み取っています（${Math.min(i+max,images.length)}/${images.length}枚）`);
      const payload=await Promise.all(g.map(x=>toImagePayload(x.blob)));
      const r=await callExtract({images:payload,labels:g.map(x=>x.label).join("、")},signal);
      items=items.concat(cleanItems(r&&r.items));
    }
  }
  // de-dupe identical rows (same item read from text and image)
  const seen=new Set(); items=items.filter(it=>{const k=norm(it.name)+"|"+it.price; if(seen.has(k)) return false; seen.add(k); return true;});
  return {items,notes};
}
function sourceSig(side){ const st=state[side]; return JSON.stringify([st.files.map(f=>f.name+f.size+f.lastModified),st.text,st.webText]); }

/* ---------- diff ---------- */
function norm(s){
  s=String(s||"").normalize("NFKC").toLowerCase();
  s=s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); // ひらがな→カタカナ
  return s.replace(/[\s・･\-‐－–—~〜～「」『』【】\[\]()<>"'`.,、。!?★☆※*♪◆◇■□●○・]/g,"");
}
function bigrams(s){ const a=[]; if(s.length<2) return [s]; for(let i=0;i<s.length-1;i++) a.push(s.slice(i,i+2)); return a; }
function dice(a,b){
  if(a===b) return 1; if(!a||!b) return 0;
  const A=bigrams(a), B=bigrams(b); const m=new Map(); A.forEach(x=>m.set(x,(m.get(x)||0)+1));
  let hit=0; B.forEach(x=>{const c=m.get(x); if(c){hit++;m.set(x,c-1);}}); return 2*hit/(A.length+B.length);
}
function computeDiff(oldItems,newItems){
  const O=oldItems.map((x,i)=>({...x,_i:i,_n:norm(x.name)})), N=newItems.map((x,i)=>({...x,_i:i,_n:norm(x.name)}));
  const pairs=[]; const usedO=new Set(), usedN=new Set();
  // 1) exact name
  N.forEach(n=>{ const o=O.find(o=>!usedO.has(o._i)&&o._n===n._n); if(o){usedO.add(o._i);usedN.add(n._i);pairs.push([o,n,1]);} });
  // 2) fuzzy
  const cand=[];
  O.forEach(o=>{ if(usedO.has(o._i)) return; N.forEach(n=>{ if(usedN.has(n._i)) return;
    let s=dice(o._n,n._n);
    if(o._n.length>=2&&n._n.length>=2&&(o._n.includes(n._n)||n._n.includes(o._n))) s=Math.max(s,.72);
    if(o.price!=null&&o.price===n.price) s+=.08;
    if(norm(o.category)===norm(n.category)&&o.category) s+=.04;
    if(s>=.6) cand.push([s,o,n]); }); });
  cand.sort((a,b)=>b[0]-a[0]);
  cand.forEach(([s,o,n])=>{ if(usedO.has(o._i)||usedN.has(n._i)) return; usedO.add(o._i);usedN.add(n._i);pairs.push([o,n,s]); });
  const rows=[], same=[];
  pairs.forEach(([o,n])=>{
    const kinds=[];
    if(o._n!==n._n) kinds.push("name");
    if((o.price??null)!==(n.price??null)) kinds.push("price");
    if(norm(o.category)!==norm(n.category)&&(o.category||n.category)) kinds.push("cat");
    const od=norm(o.description), nd=norm(n.description);
    const nameSymbolOnly=o._n===n._n&&o.name.normalize("NFKC").replace(/\s/g,"")!==n.name.normalize("NFKC").replace(/\s/g,"");
    if(od!==nd||nameSymbolOnly) kinds.push("desc");
    const r={old:o,new:n,kinds,id:"p"+o._i+"-"+n._i,order:n._i};
    (kinds.length?rows:same).push(r);
  });
  O.forEach(o=>{ if(!usedO.has(o._i)) rows.push({old:o,new:null,kinds:["del"],id:"d"+o._i,order:nearestOrder(o,pairs)}); });
  N.forEach(n=>{ if(!usedN.has(n._i)) rows.push({old:null,new:n,kinds:["add"],id:"a"+n._i,order:n._i}); });
  rows.sort((a,b)=>a.order-b.order);
  same.sort((a,b)=>a.order-b.order);
  return {rows,same};
}
function nearestOrder(o,pairs){ // place deleted items next to their old neighbours
  let best=null; pairs.forEach(([po,pn])=>{ if(po._i<o._i&&(!best||po._i>best[0]._i)) best=[po,pn]; });
  return best?best[1]._i+.5:-1;
}

/* ---------- results ---------- */
const KIND={add:["新規追加","t-add"],del:["削除","t-del"],price:["価格変更","t-price"],name:["名称変更","t-name"],cat:["カテゴリ移動","t-cat"],desc:["説明・表記","t-desc"]};
function recompute(rerenderSides,side){
  const a=itemsOf("cur"), b=itemsOf("new");
  state.diff=(a.length&&b.length)?computeDiff(a,b):null;
  if(rerenderSides){ renderSide(side); }
  renderResults();
}

      ${Object.entries(KIND).map(([k,[l,c]])=>`<button class="chip ${c}" data-k="${k}" aria-pressed="${state.filter===k}" ${counts[k]?"":"disabled style='opacity:.45'"}><span class="n">${counts[k]}</span>${l}</button>`).join("")}

function card(it,side,ch){
  // ch: which fields changed → marked in this card
  if(!it) return `<div class="ic none">${side==="before"?"（なし）":"（削除）"}</div>`;
  const m=f=>ch[f]?` class="chg"`:"";
  return `<div class="ic ${side}">
    <div class="ic-main"><span class="ic-cat"><span${m("cat")}>${esc(it.category)||"―"}</span></span><span class="ic-name"><span${m("name")}>${esc(it.name)}</span></span><span class="ic-price num"><span${m("price")}>${yen(it.price)}</span></span></div>
    ${it.description||ch.desc?`<div class="ic-desc"><span${m("desc")}>${esc(it.description)||"（説明なし）"}</span></div>`:""}
  </div>`;
}
function rowHtml(r){
  const o=r.old,n=r.new,k=r.kinds;
  const kinds=k.map(x=>`<span class="kind ${KIND[x][1]}">${KIND[x][0]}</span>`).join("");
  const ch={};
  if(o&&n){
    ch.cat=k.includes("cat"); ch.name=k.includes("name")||o.name!==n.name; ch.price=k.includes("price");
    ch.desc=norm(o.description)!==norm(n.description);
  }
  let delta="";
  if(o&&n&&ch.price&&o.price!=null&&n.price!=null){ const d=n.price-o.price; delta=`<span class="delta num">${d>0?"+":""}${d.toLocaleString("ja-JP")}円</span>`; }
  return `<tr class="${state.done.has(r.id)?"done ":""}k-${k[0]}">
    <td class="c-chk"><input type="checkbox" class="chk" data-id="${r.id}" aria-label="確認済み" ${state.done.has(r.id)?"checked":""}></td>
    <td class="c-kind"><div class="kinds">${kinds}</div></td>
    <td class="c-before">${card(o,"before",ch)}</td>
    <td class="c-arrow" aria-hidden="true">→${delta}</td>
    <td class="c-after">${card(n,"after",o?ch:{cat:1,name:1,price:1,desc:0})}</td></tr>`;
}
function tableData(){
  const head=["確認","種別","変更前:カテゴリ","変更前:品名","変更前:価格","変更前:説明","変更後:カテゴリ","変更後:品名","変更後:価格","変更後:説明","差額"];
  const body=state.diff.rows.map(r=>{const o=r.old||{},n=r.new||{};
    const dlt=(r.old&&r.new&&o.price!=null&&n.price!=null)?n.price-o.price:"";
    return [state.done.has(r.id)?"済":"",r.kinds.map(k=>KIND[k][0]).join("・"),
      r.old?o.category||"":"（なし）",o.name||"",o.price??"",o.description||"",
      r.new?n.category||"":"（削除）",n.name||"",n.price??"",n.description||"",dlt];});
  return [head,...body];
}
async function copyTable(){
  const tsv=tableData().map(r=>r.map(c=>String(c).replace(/[\t\n]/g," ")).join("\t")).join("\n");
  try{ await navigator.clipboard.writeText(tsv); toast("コピーしました。Excelに貼り付けできます"); }
  catch(e){ toast("コピーできませんでした。CSV保存をお使いください"); }
}
async function saveCsv(){
  const csv=String.fromCharCode(0xFEFF)+tableData().map(r=>r.map(c=>{const s=String(c);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(",")).join("\r\n");
  const d=new Date(); const p=x=>String(x).padStart(2,"0");
  try{ await downloads.save({filename:exportBase()+".csv",data:csv}); toast("保存しました"); }
  catch(e){ if(e&&e.code!=="declined") toast("保存できませんでした"); }
}
function exportBase(){

  s1.mergeCells("B3:E3"); s1.getCell("B3").value=subject; s1.getCell("B3").font=font({size:11,color:{argb:C.muted}});
  const info=[["店舗",storeName||"―"],["レコード",title||"―"],["レコード作成日",fd(createdAt)],["出力日時",fdt(exportedAt)],
    ["変更前の資料",(sources&&sources.cur&&sources.cur.length)?sources.cur.join("、"):"―"],["変更後の資料",(sources&&sources.new&&sources.new.length)?sources.new.join("、"):"―"],
    ["確認状況",rows.length?(leftItems?`未確認 ${leftItems}商品（変更 ${rows.length}商品中）`:`すべて確認済み（変更 ${rows.length}商品）`):"変更なし"]];
  let r=5;
  info.forEach(([k,v])=>{ s1.mergeCells(r,3,r,5); const a=s1.getCell(r,2), b=s1.getCell(r,3);
    a.value=k; a.font=font({bold:true}); a.fill=fill(C.band); b.value=v; b.font=font(k==="確認状況"&&leftItems?{bold:true,color:{argb:C.shu}}:{});
    for(let c=2;c<=5;c++){ s1.getCell(r,c).border=box; s1.getCell(r,c).alignment={vertical:"middle",wrapText:true}; }
    s1.getRow(r).height=20; r++; });
  r++;
  // 全体の規模: 新メニューの商品数 / 変更商品 / 変更なし
  const delN=rows.filter(x=>!x.new).length, chgN=rows.length, totalN=newItems.length;
  s1.mergeCells(r,2,r,5); s1.getCell(r,2).value="全体"; s1.getCell(r,2).font=font({size:11,bold:true}); s1.getRow(r).height=20; r++;
  const ov=[["新メニューの商品数",totalN,"変更後のメニューに載る全商品"],["変更商品",chgN,`追加・変更・削除のあった商品（うち削除 ${delN}商品）`],["変更のない商品",Math.max(0,totalN-(chgN-delN)),"前回から変わらない商品"]];
  ov.forEach(([k,v,note],i)=>{ const row=s1.getRow(r); row.values=[null,k,v,note]; row.height=20; s1.mergeCells(r,4,r,5);
    row.getCell(2).font=font({bold:true}); row.getCell(2).fill=fill(C.band);
    row.getCell(3).font=font({bold:true,size:i===1?12:10,color:{argb:i===1?C.shu:C.ink}}); row.getCell(3).alignment={horizontal:"center",vertical:"middle"};
    row.getCell(4).font=font({size:9,color:{argb:C.muted}});
    for(let c=2;c<=5;c++){ row.getCell(c).border=box; if(c!==3) row.getCell(c).alignment={vertical:"middle"}; }
    r++; });
  r++;
  s1.mergeCells(r,2,r,5); s1.getCell(r,2).value="変更の内訳"; s1.getCell(r,2).font=font({size:11,bold:true}); s1.getRow(r).height=20; r++;
  const hr=r; s1.getRow(hr).values=[null,"種別","商品数","確認済み","内容"]; s1.getRow(hr).height=22;
  for(let c=2;c<=5;c++){ const x=s1.getCell(hr,c); x.font=font({bold:true,color:{argb:C.white}}); x.fill=fill(C.ink); x.border=box; x.alignment={vertical:"middle",horizontal:"center"}; }
  r++;
  const NOTE={add:"新しく掲載される商品",del:"掲載が終了する商品",price:"価格が変わる商品",name:"商品名が変わる商品",cat:"掲載カテゴリが変わる商品",desc:"説明文・注記・表記が変わる商品"};
  Object.keys(LABEL).forEach(k=>{
    const rs=rows.filter(x=>x.kinds.includes(k)); const dn=rs.filter(x=>done.has(x.id)).length;
    const row=s1.getRow(r); row.values=[null,LABEL[k],rs.length,rs.length?dn:"",NOTE[k]]; row.height=20;
    const [fc,bg]=KC[k];
    row.getCell(2).font=font({bold:true,color:{argb:fc}}); row.getCell(2).fill=fill(bg);
    [3,4].forEach(c=>{ row.getCell(c).alignment={horizontal:"center",vertical:"middle"}; row.getCell(c).font=font(rs.length?{bold:c===3}:{color:{argb:C.muted}}); });
    row.getCell(5).font=font({size:9,color:{argb:C.muted}});
    for(let c=2;c<=5;c++){ row.getCell(c).border=box; if(!row.getCell(c).alignment) row.getCell(c).alignment={vertical:"middle"}; }
    r++;
  });
  const tot=s1.getRow(r); tot.values=[null,"変更商品（合計）",rows.length,rows.length-leftItems,""]; tot.height=20;
  for(let c=2;c<=5;c++){ const x=tot.getCell(c); x.font=font({bold:true}); x.fill=fill(C.band); x.border=box; x.alignment={vertical:"middle",horizontal:c===3||c===4?"center":"left"}; }
  r+=2;
  s1.mergeCells(r,2,r,5); s1.getCell(r,2).value="※ 1商品で価格と商品名が両方変わるなど、複数の種別に当てはまる商品はそれぞれの種別に数えるため、内訳の合計は変更商品数より多くなることがあります。";
  s1.getCell(r,2).font=font({size:9,color:{argb:C.muted}}); s1.getCell(r,2).alignment={wrapText:true}; s1.getRow(r).height=34;

  /* ---- sheet 2: 変更商品一覧 ---- */
  const s2=wb.addWorksheet("変更商品一覧",{views:[{state:"frozen",ySplit:3,showGridLines:false}],
    pageSetup:page({printTitlesRow:"3:3"}),headerFooter:{oddFooter:"&C&P / &N"}});
  s2.columns=[{width:5},{width:11},{width:11},{width:22},{width:12},{width:25},{width:25},{width:8},{width:6},{width:16}];
  titleRows(s2,10,`変更商品一覧　${subject}`,`出力 ${fdt(exportedAt)}　変更商品 ${rows.length}／全${newItems.length}商品　未確認 ${leftItems}商品　／　変更後の赤字が変更箇所です。確認したら「確認」欄に印を付けてください。`);
  headRow(s2,3,["No","種別","カテゴリ","商品名","項目","変更前","変更後","差額","確認","メモ"]);
  r=4;
  rows.forEach((d,i)=>{
    const L=lines(d); if(!L.length) return;
    const it=d.new||d.old, start=r, isDone=done.has(d.id);
    L.forEach(x=>{
      const row=s2.getRow(r);
      row.values=[i+1,LABEL[x.kind],it.category||"",it.name,x.item,x.before,x.after,x.delta??null,isDone?"☑":"□",""];
      const [fc,bg]=KC[x.kind];
      row.eachCell({includeEmpty:true},(c,col)=>{ if(col>10) return; c.border=box; c.font=font(); c.alignment={vertical:"middle",wrapText:true}; });
      row.getCell(1).alignment={vertical:"middle",horizontal:"center"};
      row.getCell(2).font=font({bold:true,size:9,color:{argb:fc}}); row.getCell(2).fill=fill(bg); row.getCell(2).alignment={vertical:"middle",horizontal:"center"};
      row.getCell(3).font=font({size:9,color:{argb:C.muted}});
      row.getCell(4).font=font({bold:true,strike:x.kind==="del"});
      row.getCell(5).font=font({size:9}); row.getCell(5).alignment={vertical:"middle",horizontal:"center"};
      row.getCell(6).font=font({color:{argb:C.muted},strike:x.kind!=="add"});
      row.getCell(7).font=font({bold:true,color:{argb:x.kind==="add"?C.add:C.shu}});
      row.getCell(8).numFmt='+#,##0;-#,##0;""'; row.getCell(8).font=font({bold:true,color:{argb:C.shu}}); row.getCell(8).alignment={vertical:"middle",horizontal:"right"};
      row.getCell(9).font=font({size:12,color:{argb:isDone?C.add:C.ink}}); row.getCell(9).alignment={vertical:"middle",horizontal:"center"};
      const lns=t=>String(t).split("\n").reduce((a,seg)=>a+Math.max(1,Math.ceil([...seg].length/12)),0);
      row.height=Math.max(20,Math.max(lns(x.before),lns(x.after))*14+6);
      r++;
    });
    if(r-1>start) [1,3,4,9,10].forEach(c=>s2.mergeCells(start,c,r-1,c));
  });
  if(r===4){ s2.mergeCells(4,1,4,10); s2.getCell(4,1).value="変更のある商品はありません。"; s2.getCell(4,1).font=font({color:{argb:C.muted}}); r=5; }
  s2.autoFilter={from:{row:3,column:1},to:{row:Math.max(3,r-1),column:10}};

  /* ---- sheet 3: 新メニュー全体 ---- */
  const s3=wb.addWorksheet("新メニュー全体",{views:[{state:"frozen",ySplit:3,showGridLines:false}],
    pageSetup:page({printTitlesRow:"3:3"}),headerFooter:{oddFooter:"&C&P / &N"}});
  s3.columns=[{width:8},{width:13},{width:30},{width:11},{width:38}];
  titleRows(s3,5,`新メニュー一覧　${subject}`,`全 ${newItems.length}商品（うち変更 ${rows.filter(d=>d.new).length}商品）　／　「区分」に今回の変更を示し、変更箇所を赤字にしています。`);
  headRow(s3,3,["区分","カテゴリ","商品名","価格","説明・注記"]);
  const byNew=new Map(); rows.forEach(d=>{ if(d.new) byNew.set(d.new._i,d); });
  r=4; let lastCat=null;
  newItems.forEach((it,i)=>{
    const cat=it.category||"";
    if(cat!==lastCat){ s3.mergeCells(r,1,r,5); const h=s3.getCell(r,1); h.value=cat||"（カテゴリなし）"; h.font=font({bold:true}); h.fill=fill(C.band); h.border=box; s3.getRow(r).height=20; r++; lastCat=cat; }
    const d=byNew.get(i); const k=d?d.kinds:[];
    const tag=!d?"":k.includes("add")?"新規":"変更";
    const row=s3.getRow(r); row.values=[tag,cat,it.name,it.price??"",it.description||""]; row.height=20;
    row.eachCell({includeEmpty:true},(c,col)=>{ if(col>5) return; c.border=box; c.font=font(); c.alignment={vertical:"middle",wrapText:true}; });
    row.getCell(1).alignment={vertical:"middle",horizontal:"center"};
    if(tag){ const [fc,bg]=tag==="新規"?KC.add:KC.price; row.getCell(1).font=font({bold:true,size:9,color:{argb:fc}}); row.getCell(1).fill=fill(bg); }
    row.getCell(2).font=font({size:9,color:{argb:C.muted}});
    row.getCell(4).numFmt='"¥"#,##0'; row.getCell(4).alignment={vertical:"middle",horizontal:"right"};
    const red=c=>{ row.getCell(c).font=font({bold:true,color:{argb:C.shu}}); };
    if(k.includes("add")){ [3,4].forEach(red); }
    else{
      if(k.includes("name")) red(3);
      if(k.includes("price")) red(4);
      if(k.includes("cat")) row.getCell(2).font=font({size:9,bold:true,color:{argb:C.shu}});
      if(k.includes("desc")){ if(d.old&&norm(d.old.description)!==norm(d.new.description)) red(5); else red(3); }
    }
    r++;
  });
  const dels=rows.filter(d=>!d.new);
  if(dels.length){
    r++;
    s3.mergeCells(r,1,r,5); const h=s3.getCell(r,1); h.value=`掲載終了（削除）する商品　${dels.length}商品`; h.font=font({bold:true,color:{argb:C.white}}); h.fill=fill(C.del); s3.getRow(r).height=20; r++;
    dels.forEach(d=>{ const o=d.old; const row=s3.getRow(r); row.values=["削除",o.category||"",o.name,o.price??"",o.description||""]; row.height=20;
      row.eachCell({includeEmpty:true},(c,col)=>{ if(col>5) return; c.border=box; c.font=font({color:{argb:C.muted},strike:col>=3}); c.alignment={vertical:"middle",wrapText:true}; });
      row.getCell(1).font=font({bold:true,size:9,color:{argb:C.del}}); row.getCell(1).fill=fill(C.delSoft); row.getCell(1).alignment={vertical:"middle",horizontal:"center"};
      row.getCell(4).numFmt='"¥"#,##0'; r++; });
  }
  return wb;
}
async function saveXlsx(){
  if(!window.ExcelJS){ toast("Excel出力の部品を読み込めませんでした。CSVで保存してください"); return; }
  const c=state.current, st=c&&storeById(c.storeId);
  const live={cur:srcNames("cur"),new:srcNames("new")};
  const sources={cur:live.cur.length?live.cur:(c&&c.sources?c.sources.cur:[]),new:live.new.length?live.new:(c&&c.sources?c.sources.new:[])};
  try{
    const wb=buildXlsx(ExcelJS,{storeName:st?st.name:(c?"":"サンプル"),title:c?c.title:"サンプル",createdAt:c?c.createdAt:null,sources,
      rows:state.diff.rows,done:state.done,newItems:itemsOf("new"),exportedAt:Date.now()});
    const buf=await wb.xlsx.writeBuffer();
    await downloads.save({filename:exportBase()+".xlsx",data:new Uint8Array(buf)}); toast("保存しました");
  }catch(e){ if(!(e&&e.code==="declined")) toast("保存できませんでした"); }
}
let tt; function toast(m){ let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }

/* ---------- run ---------- */
let ctl=null;
function hasSource(side){ const st=state[side]; return st.files.length||st.text.trim()||(st.webText||"").trim()||st.items; }
function renderRunState(){
  const btn=$("#run"), pg=$("#progress");
  if(ctl) return;
  const ready=hasSource("cur")&&hasSource("new");
  btn.disabled=!ready||!sample;
  if(!ready) pg.textContent=state.sample?"いまはサンプル表示です。変更前・変更後の両方に資料を登録してください。":"変更前・変更後の両方に資料を登録してください。";
  else pg.textContent=sample?"":"ログインすると読み取りを使えます。";
}
const ERR={not_granted:"Claudeの利用が許可されていません。許可すると読み取れます。",sampling_disabled:"このアカウントでは読み取り機能を使えません。",rate_limited:"利用が集中しています。少し待ってからもう一度押してください。",prompt_too_large:"資料が大きすぎます。ページ数やシートを絞って登録してください。",invalid_json:"読み取り結果をうまく整理できませんでした。もう一度押してください。",image_rejected:"画像を受け付けられませんでした。JPG・PNGで、20MB以下にしてください。",refused:"この資料は読み取れませんでした。",session_expired:"ログインし直してください。",images_unavailable:"この画面では画像を読み取れません。文字を貼り付けてください。"};
$("#run").onclick=async()=>{
  if(!sample) return;
  ctl=new AbortController(); const signal=ctl.signal;
  const btn=$("#run"), stop=$("#stop"), pg=$("#progress");
  btn.disabled=true; stop.hidden=false;
  const step=m=>{pg.innerHTML=`${esc(m)}<div class="bar"><i></i></div>`;};
  const allNotes=[]; let extracted=false;
  try{
    for(const side of ["cur","new"]){
      const st=state[side]; const sig=sourceSig(side);
      if(st.items&&st.sig===sig) continue;
      if(!st.files.length&&!st.text.trim()&&!(st.webText||"").trim()&&st.items) continue; // edited manually
      const {items,notes}=await extractSide(side,signal,step);
      st.items=items; st.sig=sig; allNotes.push(...notes); extracted=true;
      renderSide(side);
    }
    if(extracted){ state.done.clear(); state.filter="all"; }
    state.sample=false;
    recompute();
    if(state.current&&(extracted||state.current.status==="未着手")){
      state.current.status="確認中"; state.current.sources={cur:srcNames("cur"),new:srcNames("new")};
      scheduleSave({...summaryOf(),status:"確認中",sources:state.current.sources},true); renderActions();
    }
    pg.innerHTML=(allNotes.length?`<span class="err">${allNotes.map(esc).join("<br>")}</span><br>`:"")+"抽出が終わりました。読み取り違いがあれば各パネルで修正できます。";
    $("#results").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  }catch(e){
    if(e&&e.code==="cancelled") pg.textContent="中止しました。";
    else pg.innerHTML=`<span class="err">${esc(e&&(ERR[e.code]||e.message)||"読み取りに失敗しました。もう一度押してください。").replace(/\n/g,"<br>")}</span>`;
  }finally{
    ctl=null; stop.hidden=true; btn.disabled=false;
  }
};
$("#stop").onclick=()=>ctl&&ctl.abort();

/* boot */
renderSide("cur"); renderSide("new");
recompute(); renderRunState(); renderView();
})();
</script>
